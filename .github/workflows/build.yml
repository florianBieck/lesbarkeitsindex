name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      r-sidecar: ${{ steps.filter.outputs.r-sidecar }}
      # Built-in paths-filter output: JSON array of all matching filter names, e.g. ["backend","r-sidecar"]
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # The backend image carries the built SPA (ADR 0007).
            backend:
              - 'Dockerfile.backend'
              - '.dockerignore'
              - 'apps/backend/**'
              - 'apps/frontend/**'
              - 'packages/api-client/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
            r-sidecar:
              - 'Dockerfile.r-sidecar'
              - 'r-sidecar/**'

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter backend --filter @lesbarkeitsindex/api-client --filter frontend run test

      - name: Type-check the frontend
        run: pnpm --filter frontend run typecheck

      # Unused files, exports and dependencies.
      - name: Run knip
        run: pnpm run knip

  e2e-frontend:
    needs: [changes]
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.r-sidecar == 'true'
    runs-on: ubuntu-latest
    # A green run takes about 9 minutes; a hung step (as `playwright install` on
    # Node 26 before Playwright 1.65) would otherwise hold the runner for 6 hours.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      R_SIDECAR_URL: http://localhost:8787
      # Playwright runs against the backend, which serves the built SPA as in prod.
      E2E_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build r-sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.r-sidecar
          load: true
          tags: r-sidecar:e2e
          cache-from: type=gha,scope=r-sidecar

      # Started before the pnpm setup so the ~60s R startup overlaps with install + build
      - name: Start r-sidecar
        run: docker run -d --name r-sidecar -p 8787:8787 r-sidecar:e2e

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter backend run build

      - name: Build frontend
        run: pnpm --filter frontend run build

      - name: Install Playwright browser
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Wait for r-sidecar health
        run: curl -fsS --retry 60 --retry-delay 3 --retry-connrefused --retry-all-errors http://localhost:8787/health

      # Backend e2e (Vitest): only the syllable spec talks to the sidecar.
      - name: Run backend e2e tests
        run: pnpm --filter backend run test:e2e

      # The backend serves the frontend build from apps/frontend/dist.
      # Run from apps/backend to match the production Docker start command.
      - name: Start backend
        run: |
          cd apps/backend
          node dist/main.js > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:3000/api/health

      - name: Run frontend e2e
        run: pnpm --filter frontend run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 7

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "::group::r-sidecar"; docker logs r-sidecar 2>&1 | tail -80 || true; echo "::endgroup::"
          echo "::group::backend"; tail -80 backend.log 2>/dev/null || true; echo "::endgroup::"

  build:
    needs: [test, changes]
    # Empty matrix vectors fail the workflow — skip the job when nothing changed.
    if: needs.changes.outputs.services != '[]'
    # Native arm64 — prod is a Hetzner CAX instance and nothing else pulls these
    # images. Emulating arm64 on an amd64 runner took >6h and hit the job ceiling.
    runs-on: ubuntu-24.04-arm
    strategy:
      # The old per-service jobs were independent; one failing build must not cancel the others.
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.${{ matrix.service }}
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
