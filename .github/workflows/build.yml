name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      r-sidecar: ${{ steps.filter.outputs.r-sidecar }}
      # JSON array of the images to build, e.g. ["backend","r-sidecar"]
      services: ${{ steps.services.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # The backend image carries the built SPA (ADR 0007).
            backend:
              - 'Dockerfile.backend'
              - '.dockerignore'
              - 'apps/backend/**'
              - 'apps/frontend/**'
              - 'packages/api-client/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.json'
            r-sidecar:
              - 'Dockerfile.r-sidecar'
              - 'r-sidecar/**'
      # A v* tag sits on a commit main already has, so the filter finds no
      # change. A release needs both images under its version tag all the same:
      # deploy/docker-compose.yml pins both to it.
      - name: Pick the images to build
        id: services
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo 'services=["backend","r-sidecar"]' >> "$GITHUB_OUTPUT"
          else
            echo "services=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter backend --filter @lesbarkeitsindex/api-client --filter frontend run test

      - name: Type-check the frontend
        run: pnpm --filter frontend run typecheck

      # Unused files, exports and dependencies.
      - name: Run knip
        run: pnpm run knip

  e2e-frontend:
    needs: [changes]
    # A v* tag changes no file, but the images it publishes are the release.
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.r-sidecar == 'true' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # A green run takes about 9 minutes; a hung step (as `playwright install` on
    # Node 26 before Playwright 1.65) would otherwise hold the runner for 6 hours.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      R_SIDECAR_URL: http://localhost:8787
      # Playwright runs against the backend, which serves the built SPA as in prod.
      E2E_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build r-sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.r-sidecar
          load: true
          tags: r-sidecar:e2e
          cache-from: type=gha,scope=r-sidecar-amd64

      # Started before the pnpm setup so the ~60s R startup overlaps with install + build
      - name: Start r-sidecar
        run: docker run -d --name r-sidecar -p 8787:8787 r-sidecar:e2e

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter backend run build

      - name: Build frontend
        run: pnpm --filter frontend run build

      - name: Install Playwright browser
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Wait for r-sidecar health
        run: curl -fsS --retry 60 --retry-delay 3 --retry-connrefused --retry-all-errors http://localhost:8787/health

      # Backend e2e (Vitest): only the syllable spec talks to the sidecar.
      - name: Run backend e2e tests
        run: pnpm --filter backend run test:e2e

      # The backend serves the frontend build from apps/frontend/dist.
      # Run from apps/backend to match the production Docker start command.
      - name: Start backend
        run: |
          cd apps/backend
          node dist/main.js > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:3000/api/health

      - name: Run frontend e2e
        run: pnpm --filter frontend run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 7

      - name: Show service logs on failure
        if: failure()
        run: |
          echo "::group::r-sidecar"; docker logs r-sidecar 2>&1 | tail -80 || true; echo "::endgroup::"
          echo "::group::backend"; tail -80 backend.log 2>/dev/null || true; echo "::endgroup::"

  # One native runner per platform: the client's server may be x86-64, and
  # emulating the other platform under QEMU took >6h and hit the job ceiling.
  # Each leg pushes its image by digest only; `publish` puts the tags on both.
  build:
    needs: [test, changes]
    # Empty matrix vectors fail the workflow — skip the job when nothing changed.
    if: needs.changes.outputs.services != '[]'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      # One failing build must not cancel the others. `publish` still waits for
      # all of them.
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
        platform:
          # arm64 keeps the cache scope it had while it was the only platform.
          - { arch: arm64, runner: ubuntu-24.04-arm, cache-suffix: '' }
          - { arch: amd64, runner: ubuntu-24.04, cache-suffix: '-amd64' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The repository name has a capital letter; image names must not.
      - name: Set the image name
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "name=$REGISTRY/${IMAGE_NAME,,}/$SERVICE" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}

      - name: Build and push ${{ matrix.service }} (${{ matrix.platform.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.${{ matrix.service }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.service }}${{ matrix.platform.cache-suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}${{ matrix.platform.cache-suffix }}

      - name: Export the digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.service }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the two platform images of each service into one multi-platform image
  # and tags it. Runs only when every build leg passed, so no tag ever points at
  # an image that lacks a platform.
  publish:
    needs: [changes, build]
    if: github.event_name != 'pull_request' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.service }}-*
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set the image name
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "name=$REGISTRY/${IMAGE_NAME,,}/$SERVICE" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Tag the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          args=()
          while read -r tag; do
            args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("$IMAGE@sha256:$digest")
          done
          # The digest artifacts live for a day: a later re-run finds none.
          if [ "$(find . -type f | wc -l)" -ne 2 ]; then
            echo "::error::Expected one digest per platform, found: $(ls)"
            exit 1
          fi
          docker buildx imagetools create "${args[@]}"

      - name: Inspect the image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE"
