name: Deploy to Environment

on:
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: lesbarkeitsindex-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy configuration files to server
        run: |
          ssh-keyscan ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          ssh root@${{ secrets.SSH_HOST }} mkdir -p /opt/lesbarkeitsindex
          scp -r docker-compose.yml docker-compose-prod.yml Caddyfile root@${{ secrets.SSH_HOST }}:/opt/lesbarkeitsindex/

      - name: Deploy new docker stack at Hetzner Server
        run: |
          ssh root@${{ secrets.SSH_HOST }} "cd /opt/lesbarkeitsindex && export COMPOSE_PROJECT_NAME=lesbarkeitsindex-prod && docker compose -f docker-compose.yml -f docker-compose-prod.yml pull && docker compose -f docker-compose.yml -f docker-compose-prod.yml up -d"
