name: Deploy to production

# Runs after every successful build of a push to main, and on demand. Every run
# waits for approval in the production environment before it touches the
# server. A run waiting for approval holds the queue, so after two quick merges
# the older run asks first: reject it, and the newest asks next.
on:
  workflow_run:
    workflows: [Build and push Docker image]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Not secret, and a wrong directory or project name (like the deleted 2025
# workflow's) starts a second stack, so they stay visible here.
env:
  DEPLOY_HOST: lix.florianbieck.com
  DEPLOY_USER: root
  DEPLOY_DIR: /root/app/lesbarkeitsindex
  COMPOSE_PROJECT: lesbarkeitsindex

jobs:
  deploy:
    # workflow_run also fires for pull-request and v* tag builds.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ env.DEPLOY_HOST }}
    # On the job, not the workflow, so the skipped runs of pull-request builds
    # never cancel a waiting deploy. Never cancels a running deploy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # An approved older run would ship its compose files and Caddyfile next to
      # the newest :latest images.
      - name: Check that main hasn't moved on
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          main_sha=$(git ls-remote "$REPO_URL" refs/heads/main | cut -f 1)
          if [ "$main_sha" != "$DEPLOY_SHA" ]; then
            echo "::error::main is at $main_sha now, past $DEPLOY_SHA. Approve the newest deploy run instead"
            exit 1
          fi

      - name: Check the secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          for name in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS BETTER_AUTH_SECRET SEED_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set on the production environment"
              exit 1
            fi
          done
          # The .env keeps these in single quotes, so Compose takes $ and # literally.
          for name in BETTER_AUTH_SECRET SEED_ADMIN_PASSWORD; do
            case "${!name}" in
              *"'"* | *\\* | *$'\n'*)
                echo "::error::Secret $name must not contain a single quote, a backslash or a line break"
                exit 1
                ;;
            esac
          done

      - name: Check out the built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      # The runner's own OpenSSH: no third-party action gets the root key.
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | install -m 600 /dev/stdin ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
          EOF

      # Owns these four files in DEPLOY_DIR and nothing else there. COMPOSE_FILE
      # and COMPOSE_PROJECT_NAME in the .env make a plain `docker compose` in
      # DEPLOY_DIR see the whole stack.
      - name: Upload the stack
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          # shellcheck disable=SC2029 # DEPLOY_DIR expands on the runner on purpose
          ssh prod "mkdir -p '$DEPLOY_DIR'"
          scp docker-compose.yml docker-compose-prod.yml "prod:$DEPLOY_DIR/"
          scp Caddyfile "prod:$DEPLOY_DIR/Caddyfile.new"
          # shellcheck disable=SC2029 # DEPLOY_DIR expands on the runner on purpose
          {
            echo "COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT"
            echo "COMPOSE_FILE=docker-compose.yml:docker-compose-prod.yml"
            echo "BETTER_AUTH_SECRET='$BETTER_AUTH_SECRET'"
            echo "SEED_ADMIN_PASSWORD='$SEED_ADMIN_PASSWORD'"
          } | ssh prod "install -m 600 /dev/stdin '$DEPLOY_DIR/.env'"

      # Caddy doesn't watch its config, and its single-file bind mount keeps a
      # running Caddy on the file it started with, even after the mv below.
      # So the script compares what Caddy reads with the file on disk and
      # restarts it only when they differ. That also catches a restart an
      # earlier failed run never got to. `caddy reload` would reread the old
      # file and was rejected for that.
      - name: Deploy
        run: |
          # The braces make bash read the whole script before it runs any of
          # it, so no command can swallow the rest of it from stdin.
          ssh prod bash -s -- "$DEPLOY_DIR" <<'EOF'
          {
            set -euo pipefail
            cd "$1"
            docker compose pull --quiet
            docker run --rm -v "$PWD/Caddyfile.new:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            mv Caddyfile.new Caddyfile
            docker compose up -d --remove-orphans
            if ! docker compose exec -T caddy cat /etc/caddy/Caddyfile | cmp -s - Caddyfile; then
              docker compose restart caddy
            fi
          }
          EOF

      # /api/config reads the database; both answers must pass through the
      # edge, which adds HSTS.
      - name: Smoke check
        env:
          SMOKE_TIMEOUT_SECONDS: 120
        run: |
          check() {
            local headers
            headers=$(curl -sS --max-time 10 -o /dev/null -D - "https://$DEPLOY_HOST$1") || return 1
            head -n 1 <<<"$headers" | grep -q ' 200' &&
              grep -qi '^strict-transport-security:' <<<"$headers"
          }
          deadline=$((SECONDS + SMOKE_TIMEOUT_SECONDS))
          until check /api/health && check /api/config; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::https://$DEPLOY_HOST failed the smoke check for $SMOKE_TIMEOUT_SECONDS seconds"
              exit 1
            fi
            sleep 5
          done
          echo "Smoke check passed"

      - name: Prune old images
        run: ssh prod "docker image prune -f"

      # Only the container states: the logs are public, and backend logs can
      # hold email addresses. Read them on the server.
      - name: Show the stack's state
        if: failure()
        run: |
          # shellcheck disable=SC2029 # DEPLOY_DIR expands on the runner on purpose
          ssh prod "cd '$DEPLOY_DIR' && docker compose ps --all" || true
