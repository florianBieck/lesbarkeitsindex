# Production overlay — ALWAYS use together with the base file. The deploy
# workflow (.github/workflows/deploy.yml) ships both, plus the .env they read.
# Requires Docker Compose v2.24.4+ (for the !reset merge tags).
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      # The directory, not the file: a single-file bind mount keeps the running
      # container on the old Caddyfile after the deploy renames a new one into
      # place, so `caddy reload` would reread the old config (#58).
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    image: ghcr.io/florianbieck/lesbarkeitsindex/backend:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - R_SIDECAR_URL=http://r-sidecar:8787
    depends_on:
      r-sidecar:
        condition: service_healthy

  # Diffs against the base file only: pull the ghcr image instead of building,
  # and do not publish the dev port. restart/healthcheck are inherited.
  r-sidecar:
    image: ghcr.io/florianbieck/lesbarkeitsindex/r-sidecar:latest
    build: !reset null
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:
