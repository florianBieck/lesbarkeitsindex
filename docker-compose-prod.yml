# Production overlay — ALWAYS use together with the base file. The deploy
# workflow (.github/workflows/deploy.yml) ships both, plus the .env they read.
# Requires Docker Compose v2.24.4+ (for the !reset merge tags).
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      # The directory, not the file: a single-file bind mount keeps the running
      # container on the old Caddyfile after the deploy renames a new one into
      # place, so `caddy reload` would reread the old config (#58).
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    image: ghcr.io/florianbieck/lesbarkeitsindex/backend:latest
    restart: unless-stopped
    environment:
      # The deploy only takes a POSTGRES_PASSWORD made of characters a URL
      # leaves alone, so it goes into the URL unencoded.
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD:?missing from .env}@postgres:5432/lesbarkeitsindex
      - NODE_ENV=production
      - R_SIDECAR_URL=http://r-sidecar:8787
    depends_on:
      postgres:
        condition: service_started
      r-sidecar:
        condition: service_healthy

  # Diffs against the base file only: pull the ghcr image instead of building,
  # and do not publish the dev port. restart/healthcheck are inherited.
  r-sidecar:
    image: ghcr.io/florianbieck/lesbarkeitsindex/r-sidecar:latest
    build: !reset null
    ports: !reset []

  # The backend reaches Postgres over the compose network, so prod publishes no
  # port: the base file's 5432 would put the database on the internet, because
  # Docker's published ports bypass the host firewall (#72). Without a restart
  # policy a crash or reboot would leave the database down behind a running
  # backend. Image, user and database name, volume, healthcheck and logging come
  # from the base file.
  postgres:
    restart: unless-stopped
    ports: !reset []
    # Replaces the base file's public dev password. Postgres reads it only when
    # it initialises an empty volume, so every deploy also sets the existing
    # role's password to it (deploy.yml, #87).
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?missing from .env}

volumes:
  caddy_data:
  caddy_config:
