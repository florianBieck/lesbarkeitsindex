services:
  r-sidecar:
    build:
      context: .
      dockerfile: Dockerfile.r-sidecar
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8787/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - '8787:8787'
