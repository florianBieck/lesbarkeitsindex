services:
  r-sidecar:
    build:
      context: .
      dockerfile: Dockerfile.r-sidecar
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8787/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - '8787:8787'

  postgres:
    image: postgres:16
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=lesbarkeitsindex
    volumes:
      - postgres_db:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: on an empty volume the image first runs a temporary server
      # on the socket alone, which a socket check would report ready, and the
      # deploy's psql would then reach it as it shuts down (#87).
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U admin -d lesbarkeitsindex']
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: 1g

volumes:
  postgres_db:
